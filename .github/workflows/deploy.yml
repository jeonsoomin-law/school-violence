# ─────────────────────────────────────────────────────────────
# main 브랜치에 변경이 올라오면 자동으로 빌드해서 Firebase Hosting 에 배포합니다.
# 관리자 화면(/admin/)에서 변호사님이 글을 저장하면 이 워크플로가 돌면서
# 몇 분 안에 사이트에 반영됩니다.
#
# ⚠️ 처음 한 번은 저장소 시크릿 등록이 필요합니다.
#    Settings → Secrets and variables → Actions → New repository secret
#      이름: FIREBASE_SERVICE_ACCOUNT
#      값  : Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성
#             으로 받은 JSON 파일 내용 전체
# ─────────────────────────────────────────────────────────────
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # 필요할 때 수동 실행

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 이력이 있어야 사이트맵에 글마다 실제 수정일(마지막 커밋 시각)을 넣을 수 있습니다.
          # (scripts/content-lastmod.mjs) 빼면 모든 글의 수정일이 같아집니다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # IndexNow: 배포 "전" 실제 사이트의 사이트맵을 저장해 둡니다. (뒤에서 무엇이 바뀌었는지 비교용)
      - name: IndexNow — 배포 전 사이트맵 저장
        run: node scripts/indexnow.mjs snapshot "$RUNNER_TEMP/live-sitemap.json"
        continue-on-error: true

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: school-violence-b29b3
          # 기본값(latest)을 쓰면 새 버전이 나올 때마다 배포가 깨질 수 있어 고정합니다.
          # 15.34.1 부터 serviceusage.services.get 권한이 없으면 403 으로 실패합니다.
          # (firebase/firebase-tools#11335) 고쳐진 버전이 나오면 올려도 됩니다.
          firebaseToolsVersion: 15.34.0

      # IndexNow: 새 글·수정·삭제된 주소를 네이버(와 Bing 등)에 바로 알립니다.
      # 실패해도 배포는 이미 끝났으므로 실패로 표시하지 않습니다. 결과는 실행 화면 알림에 남습니다.
      - name: IndexNow — 바뀐 주소 알림
        run: node scripts/indexnow.mjs submit "$RUNNER_TEMP/live-sitemap.json"
        continue-on-error: true
