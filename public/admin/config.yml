## ─────────────────────────────────────────────────────────────
## 관리자 화면(CMS) 설정
## 여기서 저장한 글은 GitHub 저장소에 커밋되고, 배포가 자동으로 다시 돌아갑니다.
## ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: glodell/school-violence
  branch: main
  # ─────────────────────────────────────────────────────────────
  # base_url = "GitHub(으)로 로그인" 버튼이 사용하는 인증 중계 서버 주소입니다.
  # 아직 안 만들었으므로 주석 처리해 두었습니다. (가짜 주소를 넣어두면
  # 버튼을 눌렀을 때 DNS 오류만 뜨고 원인을 알 수 없습니다.)
  #
  # 그 전까지 로그인하는 방법:
  #   · 내 컴퓨터에서 작업  → "로컬 저장소로 작업"     (로그인 자체가 불필요)
  #   · 배포 후 혼자 쓸 때  → "액세스 토큰으로 로그인" (중계 서버 불필요)
  #
  # 변호사님이 계속 쓰실 거라면 아래 주석을 풀고 Worker 주소를 넣으세요.
  # 설정 방법은 README 의 "관리자 화면(CMS) 로그인 설정" 참고.
  # base_url: https://내워커주소.workers.dev

# 로컬에서 미리 써보려면: npm run dev 로 띄운 뒤 http://localhost:4321/admin/ 접속 →
# "Work with Local Repository" 버튼으로 프로젝트 폴더를 직접 열면 됩니다. 별도 서버 불필요.
# (크롬·엣지 등 크로미움 계열 브라우저에서만 동작합니다)

publish_mode: simple
media_folder: public/images
public_folder: /images

locale: ko

collections:
  # ── 칼럼 ────────────────────────────────────────────────
  - name: column
    label: 칼럼
    label_singular: 칼럼
    folder: src/content/column
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [publishDate, title, category]
    fields:
      - label: 제목
        name: title
        widget: string
        pattern: ['^[\s\S]{10,45}$', '10~45자로 써주세요. 너무 길면 검색결과에서 뒤가 잘립니다']
        hint: 노리는 검색어를 앞쪽에 배치하세요. 30자 내외가 가장 좋습니다. 예) "학폭위 확인서 작성법 — 제출 전 확인할 5가지"
      - label: URL 주소 (영문)
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈(-)만 사용하세요']
        hint: 주소가 됩니다. 예) hakpok-confirmation-letter → /column/hakpok-confirmation-letter/
      - label: 요약 (검색결과에 표시)
        name: description
        widget: text
        pattern: ['^[\s\S]{50,100}$', '50~100자로 써주세요. 70~90자가 가장 좋습니다']
        hint: 검색결과에서 제목 아래 보이는 문장입니다. 클릭 여부를 결정하니 "무엇을 알 수 있는지"를 구체적으로 쓰세요.
      - label: 발행일
        name: publishDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: 최종 수정일
        name: updatedDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false
        hint: 내용을 크게 고쳤을 때만 채우세요. 검색엔진에 갱신 신호가 됩니다.
      - label: 분류
        name: category
        widget: select
        options:
          - 학폭위 절차
          - 가해학생 대응
          - 피해학생 보호
          - 불복·소송
          - 생활기록부
          - 기타
      - label: 목표 검색어
        name: keywords
        widget: list
        required: false
        hint: 이 글로 노리는 검색어들. 관련글 자동 연결에도 쓰입니다.
      - label: 대표 이미지
        name: cover
        widget: image
        required: false
        hint: 없어도 됩니다. 넣는다면 1200x630 권장.
      - label: 목차 표시
        name: toc
        widget: boolean
        default: true
      - label: 자주 묻는 질문
        name: faq
        widget: list
        required: false
        label_singular: 질문
        summary: '{{fields.q}}'
        hint: 여기에 넣은 Q&A 는 구글 검색결과에 펼쳐진 형태로 노출될 수 있습니다. 2~5개 권장.
        fields:
          - { label: 질문, name: q, widget: string }
          - { label: 답변, name: a, widget: text }
      - label: 대표글로 표시
        name: featured
        widget: boolean
        default: false
        required: false
      - label: 임시저장(공개 안 함)
        name: draft
        widget: boolean
        default: false
      - label: 본문
        name: body
        widget: markdown
        hint: '## 소제목 을 3~6개 나눠서 쓰세요. 목차와 검색 노출에 함께 반영됩니다.'

  # ── 해결사례 ────────────────────────────────────────────
  - name: case
    label: 해결사례
    label_singular: 해결사례
    folder: src/content/case
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}}'
    fields:
      - label: 제목
        name: title
        widget: string
        hint: 학교명·지역·시기가 드러나지 않게 작성하세요.
      - label: URL 주소 (영문)
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈(-)만 사용하세요']
      - label: 요약 (검색결과에 표시)
        name: description
        widget: text
        pattern: ['^[\s\S]{50,100}$', '50~100자로 써주세요. 70~90자가 가장 좋습니다']
      - label: 게시일
        name: publishDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: 사건 유형
        name: category
        widget: select
        options: [학폭위, 행정심판, 행정소송, 형사·소년보호, 민사, 기타]
      - label: 의뢰인 지위
        name: side
        widget: select
        options: [가해학생으로 지목된 학생, 피해학생]
      - label: 결과 한 줄
        name: outcome
        widget: string
        hint: 예) 조치없음 결정, 집행정지 인용 후 조치 감경
      - label: 목표 검색어
        name: keywords
        widget: list
        required: false
      - label: 임시저장(공개 안 함)
        name: draft
        widget: boolean
        default: false
      - label: 본문
        name: body
        widget: markdown
        hint: 결과보다 "어떤 쟁점을 어떻게 다투었는지" 과정 중심으로 쓰는 편이 안전하고, 읽는 사람에게도 도움이 됩니다.

  # ── 업무분야 ────────────────────────────────────────────
  - name: service
    label: 업무분야
    label_singular: 업무분야
    folder: src/content/service
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{shortTitle}}'
    fields:
      - label: 제목 (페이지 제목)
        name: title
        widget: string
      - label: 짧은 이름 (카드·메뉴용)
        name: shortTitle
        widget: string
      - label: URL 주소 (영문)
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈(-)만 사용하세요']
      - label: 요약 (검색결과에 표시)
        name: description
        widget: text
      - label: 한 줄 소개 (페이지 상단)
        name: summary
        widget: text
      - label: 정렬 순서
        name: order
        widget: number
        value_type: int
        default: 99
      - label: 목표 검색어
        name: keywords
        widget: list
        required: false
      - label: 핵심 포인트
        name: points
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { label: 제목, name: title, widget: string }
          - { label: 설명, name: body, widget: text }
      - label: 자주 묻는 질문
        name: faq
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { label: 질문, name: q, widget: string }
          - { label: 답변, name: a, widget: text }
      - label: 임시저장(공개 안 함)
        name: draft
        widget: boolean
        default: false
      - label: 본문
        name: body
        widget: markdown

  # ── 의뢰인 후기 ─────────────────────────────────────────
  # ⚠️ 실제로 받은 내용만 올리세요. 지어낸 후기는 표시광고법·변호사 광고규정 위반입니다.
  #    의뢰인 이름·학교·지역은 반드시 가리고 올리세요.
  - name: review
    label: 의뢰인 후기
    label_singular: 후기
    folder: src/content/review
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [publishDate, category]
    fields:
      - label: 후기 요지 (목록 제목)
        name: title
        widget: string
        hint: 어떤 사건이었는지 한 줄로. 학교명·지역·실명이 들어가지 않게 쓰세요.
      - label: URL 주소 (영문)
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈(-)만 사용하세요']
      - label: 게시일
        name: publishDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: 사건 유형
        name: category
        widget: select
        options: [학폭위, 행정심판·소송, 형사·소년보호, 교권·아동학대, 기타]
      - label: 결과 한 줄
        name: outcome
        widget: string
        required: false
        hint: 예) 조치없음 결정
      - label: 작성자 표기
        name: author
        widget: string
        default: 의뢰인
        hint: 실명 금지. 예) 중학생 학부모
      - label: 전달 경로
        name: via
        widget: string
        required: false
        hint: 예) 문자, 이메일
      - label: 임시저장(공개 안 함)
        name: draft
        widget: boolean
        default: false
      - label: 본문
        name: body
        widget: markdown
        hint: 의뢰인이 보내온 말은 인용(>)으로 감싸면 따로 구분되어 표시됩니다.
